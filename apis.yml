name: Niramai
description: >-
  NIRAMAI Health Analytix is a Bangalore, India based deep-tech healthcare company that
  develops AI-powered, radiation-free breast cancer screening solutions. Its core product,
  Thermalytix, uses machine learning and deep learning to analyze thermal images of the
  chest for early-stage tumor detection, complemented by the FDA-cleared SMILE-100 thermal
  imaging device and the Mythri mobile screening service for primary healthcare settings.
  The company reports 40+ patents, 55+ clinical publications, and 500,000+ women screened
  across 22+ countries. Backed by 500 Global. As of this enrichment pass, Niramai publishes
  no public API, developer portal, SDK, or documentation surface; this profile captures its
  company identity and domain-security posture.
